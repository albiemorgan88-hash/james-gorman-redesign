<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue Canvas - Personalized Showcase</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2B4DAF 0%, #1e3a8a 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .loading {
            text-align: center;
        }
        .spinner {
            border: 4px solid #ffffff33;
            border-top: 4px solid #FF4520;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="loading">
        <div class="spinner"></div>
        <div class="logo">Blue Canvas</div>
        <div>Loading your personalized showcase...</div>
    </div>

    <script>
        // Get email parameter from URL (support both 'email' and 'ref')
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || urlParams.get('ref');

        // Email to showcase mapping
        const showcaseMap = {
            'paul.foley@efmccambridge.co.uk': 'https://albiemorgan88-hash.github.io/efmccambridge-audit/',
            'christine.whiteman@efmccambridge.co.uk': 'https://albiemorgan88-hash.github.io/efmccambridge-audit/',
            'nathan@mjkane.co.uk': 'https://albiemorgan88-hash.github.io/mjkane-opportunities/',
            'info@mclaughlinandco.net': 'https://albiemorgan88-hash.github.io/mclaughlin-seo-analysis/',
            'derry@mooreni.co.uk': 'https://albiemorgan88-hash.github.io/mooreni-growth-analysis/',
            'info@claremount.net': 'https://albiemorgan88-hash.github.io/claremount-digital-audit/'
        };

        // Default showcase for unknown emails
        const defaultShowcase = 'https://albiemorgan88-hash.github.io/efmccambridge-audit/';

        // Redirect logic
        setTimeout(() => {
            if (email && showcaseMap[email.toLowerCase()]) {
                window.location.href = showcaseMap[email.toLowerCase()];
            } else if (email) {
                // Log unknown email for analysis
                console.log('Unknown email:', email);
                window.location.href = defaultShowcase;
            } else {
                // No email parameter, redirect to default
                window.location.href = defaultShowcase;
            }
        }, 1500); // 1.5 second delay for branding

        // Analytics tracking (optional)
        if (email) {
            // Track which emails are accessing showcases
            fetch('https://api.github.com/repos/albiemorgan88-hash/showcase-analytics/issues', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    title: `Showcase Access: ${email}`,
                    body: `Email: ${email}\nTimestamp: ${new Date().toISOString()}\nShowcase: ${showcaseMap[email.toLowerCase()] || 'default'}`
                })
            }).catch(() => {}); // Silent fail for analytics
        }
    </script>
</body>
</html>
