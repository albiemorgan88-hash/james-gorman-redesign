        // Get parameters from URL
        const urlParams = new URLSearchParams(window.location.search);
        const pathname = window.location.pathname;
        
        // Check if we have a company slug in the path (e.g., /mcaleerjackson)
        const pathSlug = pathname.substring(1); // Remove leading slash
        
        // Get email parameter (support both 'email' and 'ref')
        const email = urlParams.get('email') || urlParams.get('ref');
        
        // Default showcase for unknown entries
        const defaultShowcase = 'https://albiemorgan88-hash.github.io/efmccambridge-audit/';

        function getShowcaseUrl() {
            // Priority 1: Company slug in path
            if (pathSlug && companyToShowcase[pathSlug.toLowerCase()]) {
                return companyToShowcase[pathSlug.toLowerCase()];
            }
            
            // Priority 2: Email parameter mapping
            if (email && emailToCompany[email.toLowerCase()]) {
                const companySlug = emailToCompany[email.toLowerCase()];
                return companyToShowcase[companySlug];
            }
            
            // Priority 3: Default showcase
            return defaultShowcase;
        }

        // Analytics tracking
        function trackAccess(method, identifier) {
            try {
                const data = {
                    method: method, // 'slug' or 'email'
                    identifier: identifier,
                    timestamp: new Date().toISOString(),
                    userAgent: navigator.userAgent,
                    referrer: document.referrer
                };
                
                // Send to analytics endpoint (silent fail)
                fetch('https://api.github.com/repos/albiemorgan88-hash/showcase-analytics/issues', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: `Showcase Access: ${method}`,
                        body: JSON.stringify(data, null, 2)
                    })
                }).catch(() => {}); // Silent fail
            } catch (e) {
                // Silent fail for analytics
            }
        }

        // Redirect logic
        setTimeout(() => {
            const showcaseUrl = getShowcaseUrl();
            
            // Track the access method
            if (pathSlug && companyToShowcase[pathSlug.toLowerCase()]) {
                trackAccess('slug', pathSlug);
            } else if (email && emailToCompany[email.toLowerCase()]) {
                trackAccess('email', email);
            } else {
                trackAccess('default', email || pathSlug || 'unknown');
            }
            
            // Redirect to the showcase
            window.location.href = showcaseUrl;
        }, 1500); // 1.5 second delay for branding
    </script>
