<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Mythos Leak - Blue Canvas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }
        
        .container {
            width: 1200px;
            height: 628px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 60px;
        }
        
        /* Subtle circuit-style background elements */
        .circuit-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            background-image: 
                linear-gradient(90deg, #4fc3f7 1px, transparent 1px),
                linear-gradient(180deg, #4fc3f7 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: 0 0, 0 0;
        }
        
        /* Glowing orb in top right */
        .glow-orb {
            position: absolute;
            top: 80px;
            right: 150px;
            width: 120px;
            height: 120px;
            background: radial-gradient(circle, #4fc3f7 0%, rgba(79, 195, 247, 0.3) 40%, transparent 70%);
            border-radius: 50%;
            opacity: 0.6;
        }
        
        /* Additional subtle glow elements */
        .accent-line {
            position: absolute;
            top: 50%;
            left: -200px;
            width: 600px;
            height: 2px;
            background: linear-gradient(90deg, transparent 0%, #4fc3f7 50%, transparent 100%);
            transform: rotate(-15deg);
            opacity: 0.3;
        }
        
        .main-content {
            z-index: 10;
            text-align: center;
            max-width: 900px;
        }
        
        .headline {
            font-size: 78px;
            font-weight: 900;
            color: #ffffff;
            line-height: 0.95;
            margin-bottom: 30px;
            letter-spacing: -2px;
            text-shadow: 0 4px 20px rgba(79, 195, 247, 0.3);
        }
        
        .subtext {
            font-size: 32px;
            font-weight: 400;
            color: #b8c6db;
            line-height: 1.3;
            margin-bottom: 80px;
        }
        
        .branding {
            position: absolute;
            bottom: 40px;
            right: 60px;
            color: #4fc3f7;
            font-size: 24px;
            font-weight: 600;
            text-align: right;
            line-height: 1.2;
        }
        
        .brand-name {
            font-size: 28px;
            font-weight: 700;
        }
        
        /* Subtle animated pulse for the orb */
        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }
        
        .glow-orb {
            animation: pulse 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Background elements -->
        <div class="circuit-lines"></div>
        <div class="glow-orb"></div>
        <div class="accent-line"></div>
        
        <!-- Main content -->
        <div class="main-content">
            <h1 class="headline">Claude Mythos<br>Just Leaked.</h1>
            <p class="subtext">Here's what it means for your business.</p>
        </div>
        
        <!-- Branding -->
        <div class="branding">
            <div class="brand-name">Blue Canvas</div>
            <div>AI-Powered Growth</div>
        </div>
    </div>
</body>
</html>
