<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>The Self Storage Centre — AI Assistant Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#1a5276;--primary-light:#2980b9;--accent:#e67e22;--bg:#f0f2f5;--white:#fff;--gray:#e5e5ea;--dark:#1a1a2e;--text:#333;--light-text:#666;--bot-bg:#fff;--user-bg:#1a5276}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 12px rgba(0,0,0,.15);z-index:10;flex-shrink:0}
.header-avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:700;flex-shrink:0}
.header-info h1{font-size:16px;font-weight:600}
.header-info p{font-size:12px;opacity:.85;margin-top:1px}
.header .status-dot{width:8px;height:8px;background:#2ecc71;border-radius:50%;display:inline-block;margin-right:4px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.chat-area{flex:1;overflow-y:auto;padding:12px 16px 8px;display:flex;flex-direction:column;gap:4px;scroll-behavior:smooth}
.msg-group{display:flex;flex-direction:column;gap:2px;margin-bottom:8px}
.msg-row{display:flex;align-items:flex-end;gap:8px;max-width:88%}
.msg-row.bot{align-self:flex-start}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse}
.msg-avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;margin-bottom:2px}
.msg-row.bot .msg-avatar{background:var(--accent);color:#fff}
.msg-row.user .msg-avatar{background:var(--primary);color:#fff}
.bubble{padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;max-width:100%;word-wrap:break-word;position:relative;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.msg-row.bot .bubble{background:var(--white);color:var(--text);border-bottom-left-radius:6px}
.msg-row.user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:6px}
.timestamp{font-size:10px;color:#999;margin-top:2px;padding:0 36px}
.timestamp.right{text-align:right}
.typing{display:flex;align-items:center;gap:4px;padding:12px 16px}
.typing .dot{width:8px;height:8px;background:#999;border-radius:50%;animation:typingAnim 1.4s infinite}
.typing .dot:nth-child(2){animation-delay:.2s}
.typing .dot:nth-child(3){animation-delay:.4s}
@keyframes typingAnim{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
.typing-indicator{display:flex;align-items:flex-end;gap:8px;max-width:88%;align-self:flex-start}
.typing-indicator .msg-avatar{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.typing-bubble{background:var(--white);padding:12px 18px;border-radius:18px;border-bottom-left-radius:6px;display:flex;gap:5px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.typing-bubble .dot{width:7px;height:7px;background:#aaa;border-radius:50%;animation:typingAnim 1.4s infinite}
.typing-bubble .dot:nth-child(2){animation-delay:.2s}
.typing-bubble .dot:nth-child(3){animation-delay:.4s}
.scenarios{flex-shrink:0;background:var(--white);border-top:1px solid #e0e0e0;padding:10px 12px}
.scenarios-label{font-size:11px;color:#999;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;font-weight:600}
.scenario-pills{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scenario-pills::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;padding:8px 16px;background:var(--bg);border:1.5px solid #d0d0d0;border-radius:20px;font-size:13px;color:var(--text);cursor:pointer;transition:all .2s;white-space:nowrap;-webkit-tap-highlight-color:transparent}
.pill:hover,.pill.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pill.active{transform:scale(.96)}
.welcome{text-align:center;padding:40px 20px;color:var(--light-text)}
.welcome h2{font-size:20px;color:var(--primary);margin-bottom:8px}
.welcome p{font-size:14px;line-height:1.5}
.welcome .arrow{font-size:24px;margin-top:16px;animation:bounce 2s infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
.badge{display:inline-block;background:var(--accent);color:#fff;font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;margin-left:6px}
.powered{text-align:center;padding:8px;font-size:10px;color:#aaa;flex-shrink:0;background:var(--white)}
.powered a{color:var(--primary-light);text-decoration:none}
</style>
</head>
<body>
<div class="header">
<div class="header-avatar">S</div>
<div class="header-info">
<h1>Sam <span class="badge">AI Assistant</span></h1>
<p><span class="status-dot"></span>Online — The Self Storage Centre NI</p>
</div>
</div>

<div class="chat-area" id="chat">
<div class="welcome" id="welcome">
<h2>👋 Meet Sam</h2>
<p>Your 24/7 AI assistant for<br><strong>The Self Storage Centre</strong></p>
<p style="margin-top:12px;font-size:13px">Tap a question below to see Sam in action</p>
<div class="arrow">↓</div>
</div>
</div>

<div class="scenarios">
<div class="scenarios-label">Try a question</div>
<div class="scenario-pills" id="pills"></div>
</div>

<div class="powered">Powered by <a href="#">OpenClaw AI</a> · Built for Self Storage Centre NI</div>

<script>
const scenarios=[
{pill:"📦 Business files",user:"Hi, I need storage for my business files",bot:[
"Hi there! 👋 I'd love to help you find the right storage for your business files.",
"Could you give me a rough idea of how much you're looking to store? For example — a few filing cabinet's worth, or are we talking full archive rooms?",
"We offer dedicated archive and file storage at both our locations:\n\n📍 <b>Belfast</b> — 028 9083 7647\n📍 <b>Lisburn</b> — 028 9266 4444\n\nFor a small office archive, a <b>25–50 sq ft</b> unit often works perfectly. For larger volumes, we go right up to <b>2,000+ sq ft</b>.\n\nWould you like me to help you figure out the right size, or would you prefer to pop in for a look around?"]},

{pill:"💷 Pricing",user:"How much is a small unit?",bot:[
"Great question! Pricing depends on the unit size, location, and how long you need it for — but I can give you a steer 😊",
"Our smallest units start from around <b>20 sq ft</b> — think of a large walk-in wardrobe. Perfect for boxes, personal items, or business files.\n\nA few things that affect pricing:\n• <b>Unit size</b> — 20 to 2,000+ sq ft\n• <b>Location</b> — Belfast or Lisburn\n• <b>Duration</b> — longer stays often have better rates",
"The best way to get an exact quote is to give us a quick call or pop in:\n\n📞 Belfast: <b>028 9083 7647</b>\n📞 Lisburn: <b>028 9266 4444</b>\n\nOr I can take your details and have someone get back to you — what works best?"]},

{pill:"🏠 Moving home",user:"I'm moving house next month, what do you recommend?",bot:[
"Exciting times! 🏡 Moving house is one of the most common reasons people use our storage.",
"Here's what I'd suggest — it really depends on how much you need to store:\n\n• <b>1-bed flat</b> → 50–75 sq ft unit\n• <b>2-3 bed house</b> → 100–150 sq ft unit\n• <b>4+ bed house</b> → 200+ sq ft unit\n\nMany customers store furniture and boxes between completion dates, during renovations, or while they settle in.",
"Both our <b>Belfast</b> and <b>Lisburn</b> locations have great access for vans and trailers. You can move in and out as much as you need.\n\nWant me to take your details so we can hold a unit for your move date?"]},

{pill:"🕐 Opening hours",user:"What are your opening hours?",bot:[
"Here are our opening hours and location details:\n\n🏢 <b>Belfast</b>\n605 Antrim Road, Mallusk, BT36 4RY\n📞 028 9083 7647\n\n🏢 <b>Lisburn</b>\n📞 028 9266 4444\n\nBoth sites are open <b>Monday to Friday 9am–5:30pm</b> and <b>Saturday 9am–1pm</b>. Access to your unit is available outside of these hours too — just ask us about our access arrangements!",
"Is there anything else I can help with? 😊"]},

{pill:"📦 Boxes",user:"Do you sell boxes?",bot:[
"Yes! We have a <b>Box Shop</b> at our locations 📦",
"We stock everything you'll need for a move or packing up:\n\n✅ Small, medium & large moving boxes\n✅ Wardrobe boxes\n✅ Bubble wrap & packing paper\n✅ Tape & tape guns\n✅ Mattress & sofa covers\n\nYou can pick them up when you visit, or give us a call ahead and we'll have them ready for you.\n\n📞 Belfast: <b>028 9083 7647</b>\n📞 Lisburn: <b>028 9266 4444</b>"]},

{pill:"🏬 Online business",user:"I run an online business and need warehouse space",bot:[
"Brilliant — you're exactly who we love working with! 🚀",
"We offer <b>commercial storage</b> tailored for online retailers, including:\n\n📦 <b>Warehouse storage</b> — from 100 to 2,000+ sq ft\n📦 <b>Stock & inventory storage</b> — secure, accessible\n📦 <b>3PL service</b> — we can receive, store, and despatch your goods for you\n\nOur 3PL service is perfect if you want to outsource fulfilment — we handle the logistics so you can focus on growing your business.",
"Lots of our e-commerce clients started with a small unit and scaled up as their business grew. Flexible terms, no long contracts.\n\nWant to chat about what you need? Call us or I can arrange a callback:\n\n📞 Belfast: <b>028 9083 7647</b>\n📞 Lisburn: <b>028 9266 4444</b>\n📧 info@storagecentreni.co.uk"]},

{pill:"📍 Location",user:"Where are you located?",bot:[
"We have two convenient locations in Northern Ireland:\n\n📍 <b>Belfast / Mallusk</b>\n605 Antrim Road, Mallusk, BT36 4RY\n📞 028 9083 7647\n\n📍 <b>Lisburn</b>\n📞 028 9266 4444\n\nBoth sites have easy access for cars, vans, and even large vehicles. Free parking on site!",
"You're welcome to pop in anytime during opening hours for a tour — no appointment needed 😊"]},

{pill:"🔑 24/7 access",user:"Can I access my unit anytime?",bot:[
"Great question! We understand that flexibility is important.\n\nDuring <b>office hours</b> (Mon–Fri 9am–5:30pm, Sat 9am–1pm), you can come and go freely.\n\nFor <b>out-of-hours access</b>, we can arrange extended access so you can get to your unit when you need it — just let us know and we'll set it up.",
"Many of our business customers use extended access for early morning deliveries or evening stock checks.\n\nJust give us a call and we'll sort it for you:\n📞 Belfast: <b>028 9083 7647</b>\n📞 Lisburn: <b>028 9266 4444</b>"]}
];

const chat=document.getElementById('chat');
const pillsC=document.getElementById('pills');
const welcome=document.getElementById('welcome');
let playing=false;

function time(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}

function addMsg(text,type,showAvatar=true){
const row=document.createElement('div');
row.className='msg-row '+type;
if(showAvatar){
const av=document.createElement('div');
av.className='msg-avatar';
av.textContent=type==='bot'?'S':'You'.charAt(0);
row.appendChild(av);
}
const b=document.createElement('div');
b.className='bubble';
b.innerHTML=text;
row.appendChild(b);
chat.appendChild(row);
chat.scrollTop=chat.scrollHeight;
return row;
}

function addTime(side){
const t=document.createElement('div');
t.className='timestamp'+(side==='right'?' right':'');
t.textContent=time();
chat.appendChild(t);
chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
const el=document.createElement('div');
el.className='typing-indicator';
el.id='typing';
el.innerHTML='<div class="msg-avatar">S</div><div class="typing-bubble"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
chat.appendChild(el);
chat.scrollTop=chat.scrollHeight;
}

function hideTyping(){const el=document.getElementById('typing');if(el)el.remove()}

function delay(ms){return new Promise(r=>setTimeout(r,ms))}

async function playScenario(idx){
if(playing)return;
playing=true;
document.querySelectorAll('.pill').forEach((p,i)=>p.classList.toggle('active',i===idx));
welcome.style.display='none';
chat.querySelectorAll('.msg-row,.timestamp,.typing-indicator').forEach(e=>e.remove());
const s=scenarios[idx];
await delay(300);
addMsg(s.user,'user');
addTime('right');
await delay(800);
for(let i=0;i<s.bot.length;i++){
showTyping();
await delay(1000+Math.random()*800);
hideTyping();
addMsg(s.bot[i],'bot');
if(i===s.bot.length-1)addTime('left');
await delay(400);
}
playing=false;
}

scenarios.forEach((s,i)=>{
const p=document.createElement('div');
p.className='pill';
p.textContent=s.pill;
p.onclick=()=>playScenario(i);
pillsC.appendChild(p);
});
</script>
</body>
</html>
