<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Self Storage Centre — AI Assistant Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f2f5;height:100vh;display:flex;flex-direction:column}
.header{background:#2B4DAF;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header-avatar{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.header-info h1{font-size:16px;font-weight:600}
.header-info p{font-size:12px;opacity:.85;margin-top:2px}
.status-dot{width:8px;height:8px;background:#4ade80;border-radius:50%;display:inline-block;margin-right:4px}
.chat-area{flex:1;overflow-y:auto;padding:16px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.msg{max-width:82%;padding:10px 14px;border-radius:16px;font-size:14.5px;line-height:1.45;animation:fadeIn .3s ease}
.msg-bot{background:#fff;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg-user{background:#2B4DAF;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.msg a{color:#FF4520;text-decoration:underline}
.msg-bot a{color:#2B4DAF;font-weight:500}
.typing{align-self:flex-start;background:#fff;padding:12px 18px;border-radius:16px;border-bottom-left-radius:4px;display:none;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.typing span{display:inline-block;width:8px;height:8px;background:#aaa;border-radius:50%;margin:0 2px;animation:bounce .6s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.options{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0;align-self:flex-start;max-width:90%}
.opt-btn{background:#fff;border:1.5px solid #2B4DAF;color:#2B4DAF;padding:8px 14px;border-radius:20px;font-size:13.5px;cursor:pointer;transition:all .2s;font-family:inherit;line-height:1.3}
.opt-btn:hover,.opt-btn:active{background:#2B4DAF;color:#fff}
.input-area{background:#fff;padding:12px 16px;border-top:1px solid #e5e7eb;display:flex;gap:8px;align-items:center}
.input-area input{flex:1;border:1px solid #d1d5db;border-radius:24px;padding:10px 16px;font-size:14px;outline:none;font-family:inherit}
.input-area input:focus{border-color:#2B4DAF}
.input-area button{background:#FF4520;color:#fff;border:none;width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background .2s}
.input-area button:hover{background:#e03d1c}
.footer{background:#2B4DAF;color:rgba(255,255,255,.7);text-align:center;padding:8px;font-size:11px}
.footer a{color:#fff;text-decoration:none;font-weight:600}
.lead-form{background:#fff;border-radius:16px;padding:16px;max-width:82%;align-self:flex-start;box-shadow:0 1px 2px rgba(0,0,0,.08);animation:fadeIn .3s ease}
.lead-form h3{font-size:14px;color:#2B4DAF;margin-bottom:10px}
.lead-form input,.lead-form select{width:100%;padding:9px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px;margin-bottom:8px;font-family:inherit}
.lead-form button{background:#FF4520;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-size:14px;cursor:pointer;width:100%;font-weight:600;font-family:inherit}
.info-card{background:linear-gradient(135deg,#f8faff,#eef2ff);border:1px solid #dde4f0;border-radius:16px;padding:14px;max-width:82%;align-self:flex-start;animation:fadeIn .3s ease}
.info-card h4{font-size:13px;color:#2B4DAF;margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px}
.info-card p,.info-card li{font-size:13.5px;line-height:1.5;color:#333}
.info-card ul{padding-left:16px;margin:4px 0}
</style>
</head>
<body>
<div class="header">
<div class="header-avatar">📦</div>
<div class="header-info">
<h1>The Self Storage Centre</h1>
<p><span class="status-dot"></span>AI Assistant — Always Online</p>
</div>
</div>
<div class="chat-area" id="chat">
<div class="typing" id="typing"><span></span><span></span><span></span></div>
</div>
<div class="input-area">
<input type="text" id="userInput" placeholder="Type a message..." autocomplete="off">
<button onclick="handleFreeText()">➤</button>
</div>
<div class="footer">Powered by <a href="https://bluecanvas.ai" target="_blank">Blue Canvas AI</a></div>

<script>
const chat = document.getElementById('chat');
const typing = document.getElementById('typing');
const userInput = document.getElementById('userInput');

userInput.addEventListener('keypress', e => { if(e.key==='Enter') handleFreeText() });

const conversations = {
  start: {

        <li><strong>3PL Service</strong> — we can receive & dispatch for you</li>
        <li><strong>Online Retailer Storage</strong> — stock & fulfilment</li>

  },
  quote: {
    bot: ["Brilliant! Let me grab a few details and the team will get back to you with a personalised quote — usually within the hour. 🚀"],
    form: true
  },
  quote_thanks: {
    bot: ["Thanks a million! ✅ Your quote request has been sent to the team. Someone will be in touch shortly — usually within the hour during office hours.", "In the meantime, is there anything else I can help with?"],
    options: [
      {text: "📏 Unit sizes", next: "sizes"},

      {text: "👋 That's everything, thanks!", next: "goodbye"}
    ]
  },
  goodbye: {
    bot: ["No problem at all! Thanks for chatting with us. If you need anything else, I'm here 24/7. Have a great day! 😊", "📞 Belfast: 028 9083 7647 | Lisburn: 028 9266 4444"],
    options: []
  },
  fallback: {
    bot: ["I appreciate the question! I can help best with the topics below. Pick one and I'll get you sorted:"],
    options: [
      {text: "📏 Unit sizes & pricing", next: "sizes"},
      {text: "📍 Locations & directions", next: "locations"},
      {text: "🕐 Opening hours", next: "hours"},
      {text: "📦 Box shop", next: "boxshop"},

let currentStep = null;
let msgQueue = [];
let isProcessing = false;

function scrollDown() {
  requestAnimationFrame(() => chat.scrollTop = chat.scrollHeight);
}

function addMsg(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls;
  d.innerHTML = text;
  chat.insertBefore(d, typing);
  scrollDown();
}

function addCard(title, content) {
  const d = document.createElement('div');
  d.className = 'info-card';
  d.innerHTML = `<h4>${title}</h4>${content}`;
  chat.insertBefore(d, typing);
  scrollDown();
}

function addOptions(opts) {
  const d = document.createElement('div');
  d.className = 'options';
  opts.forEach(o => {
    const b = document.createElement('button');
    b.className = 'opt-btn';
    b.textContent = o.text;
    b.onclick = () => {
      addMsg(o.text, 'msg-user');
      d.remove();
      removeAllOptions();
      setTimeout(() => playConversation(o.next), 400);
    };
    d.appendChild(b);
  });
  chat.insertBefore(d, typing);
  scrollDown();
}

function removeAllOptions() {
  chat.querySelectorAll('.options').forEach(el => el.remove());
}

function addForm() {
  const d = document.createElement('div');
  d.className = 'lead-form';
  d.innerHTML = `
    <h3>📋 Quick Quote Request</h3>
    <input type="text" id="f_name" placeholder="Your name *" required>
    <input type="tel" id="f_phone" placeholder="Phone number *" required>
    <input type="email" id="f_email" placeholder="Email (optional)">
    <select id="f_location">
      <option value="">Preferred location</option>
      <option value="belfast">Belfast (Mallusk)</option>
      <option value="lisburn">Lisburn</option>
      <option value="unsure">Not sure yet</option>
    </select>
    <select id="f_type">
      <option value="">Storage type</option>
      <option value="personal">Personal / Home</option>
      <option value="business">Business</option>
    </select>
    <input type="text" id="f_details" placeholder="What are you storing? (brief description)">
    <button onclick="submitForm()">Send Quote Request ➤</button>
  `;
  chat.insertBefore(d, typing);
  scrollDown();
}

function submitForm() {
  const name = document.getElementById('f_name').value;
  const phone = document.getElementById('f_phone').value;
  if(!name || !phone) { alert('Please enter your name and phone number'); return; }
  document.querySelector('.lead-form').innerHTML = '<p style="text-align:center;padding:12px;color:#2B4DAF;font-weight:600">✅ Sent! (Demo — no data stored)</p>';
  setTimeout(() => playConversation('quote_thanks'), 800);
}

function showTyping() { typing.style.display = 'block'; scrollDown(); }
function hideTyping() { typing.style.display = 'none'; }

async function playConversation(key) {
  const conv = conversations[key] || conversations.fallback;
  currentStep = key;
  
  for(const text of conv.bot) {
    showTyping();
    await delay(800 + text.length * 12);
    hideTyping();
    addMsg(text, 'msg-bot');
  }
  
  if(conv.card) {
    showTyping();
    await delay(600);
    hideTyping();
    addCard(conv.card.title, conv.card.content);
  }
  
  if(conv.bot2) {
    for(const text of conv.bot2) {
      showTyping();
      await delay(600 + text.length * 10);
      hideTyping();
      addMsg(text, 'msg-bot');
    }
  }
  
  if(conv.form) {
    await delay(300);
    addForm();
  }
  
  if(conv.options && conv.options.length) {
    await delay(300);
    addOptions(conv.options);
  }
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

function handleFreeText() {
  const text = userInput.value.trim();
  if(!text) return;
  userInput.value = '';
  addMsg(text, 'msg-user');
  removeAllOptions();
  
  const lower = text.toLowerCase();
  let next = 'fallback';
  if(/pric|cost|how much|rate|quote|book/.test(lower)) next = 'quote';
  else if(/size|big|small|large|medium|sq|square|feet|space|fit/.test(lower)) next = 'sizes';
  else if(/where|location|address|direction|find you|belfast|lisburn|mallusk/.test(lower)) next = 'locations';
  else if(/hour|open|close|access|time|when/.test(lower)) next = 'hours';
  else if(/box|pack|tape|bubble|wrap|moving kit/.test(lower)) next = 'boxshop';
  else if(/business|commercial|warehouse|pallet|3pl|archive|stock/.test(lower)) next = 'business';
  else if(/tip|advice|how to|moving/.test(lower)) next = 'tips';
  else if(/hi|hello|hey|hiya/.test(lower)) next = 'start';
  else if(/thank|bye|cheers/.test(lower)) next = 'goodbye';
  
  setTimeout(() => playConversation(next), 400);
}

// Start
setTimeout(() => playConversation('start'), 500);
</script>
</body>
</html>
