  <rect x="0" y="0" width="1200" height="6" fill="#2563eb"/>
  <!-- Question mark decorative -->
  <text x="950" y="420" font-family="Helvetica, Arial, sans-serif" font-size="300" font-weight="800" fill="#2563eb" opacity="0.06">?</text>
  <!-- Content -->
  <text x="600" y="250" font-family="Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#131313" text-anchor="middle">Is Your Business</text>
