<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2B4DAF"/>
      <stop offset="100%" stop-color="#1a3280"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle grid pattern fading/breaking apart -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" fill="none">
    <!-- Vertical lines - some broken -->
    <line x1="100" y1="80" x2="100" y2="547"/>
    <line x1="200" y1="80" x2="200" y2="547"/>
    <line x1="300" y1="80" x2="300" y2="400"/>
    <line x1="400" y1="80" x2="400" y2="547"/>
    <line x1="500" y1="80" x2="500" y2="350"/>
    <line x1="600" y1="80" x2="600" y2="547"/>
    <line x1="700" y1="80" x2="700" y2="280"/>
    <line x1="800" y1="80" x2="800" y2="547"/>
    <line x1="900" y1="80" x2="900" y2="200"/>
    <line x1="1000" y1="80" x2="1000" y2="547"/>
    <line x1="1100" y1="80" x2="1100" y2="150"/>
    <!-- Horizontal lines -->
    <line x1="60" y1="150" x2="1140" y2="150"/>
    <line x1="60" y1="250" x2="900" y2="250"/>
    <line x1="60" y1="350" x2="700" y2="350"/>
    <line x1="60" y1="450" x2="500" y2="450"/>
  </g>

  <!-- Downward disruption line - abstract decline -->
  <polyline points="150,200 350,210 550,240 700,300 850,400 1000,520" 
    stroke="#FF4520" stroke-opacity="0.25" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Small scattered dots suggesting fragmentation -->
  <g fill="#ffffff" fill-opacity="0.05">
    <circle cx="920" cy="180" r="3"/>
    <circle cx="980" cy="220" r="2"/>
    <circle cx="1050" cy="160" r="4"/>
    <circle cx="1080" cy="250" r="2.5"/>
    <circle cx="1020" cy="300" r="1.5"/>
  </g>

  <!-- Main headline -->
  <text x="600" y="260" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="82" fill="#ffffff" text-anchor="middle" letter-spacing="4">Kodak X Nokia</text>

  <!-- Orange underline accent -->
  <rect x="420" y="280" width="360" height="4" rx="2" fill="#FF4520"/>

  <!-- Subtitle -->
  <text x="600" y="340" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="30" fill="#ffffff" fill-opacity="0.75" text-anchor="middle" letter-spacing="2">The cost of standing still</text>

  <!-- Blue Canvas branding bottom center -->
  <text x="600" y="560" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="16" fill="#ffffff" fill-opacity="0.4" text-anchor="middle" letter-spacing="3">BLUE CANVAS</text>

  <!-- bluecanvas.ai bottom right -->
  <text x="1160" y="600" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="13" fill="#ffffff" fill-opacity="0.35" text-anchor="end">bluecanvas.ai</text>
</svg>