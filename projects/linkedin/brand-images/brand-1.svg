<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <pattern id="geo" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="none"/>
      <polygon points="60,10 110,35 110,85 60,110 10,85 10,35" fill="none" stroke="#3A5DBF" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>
  <rect width="1080" height="1080" fill="#2B4DAF"/>
  <rect width="1080" height="1080" fill="url(#geo)"/>
  <!-- Accent bar -->
  <rect x="440" y="340" width="200" height="5" rx="2" fill="#FF4520"/>
  <!-- Headline -->
  <text x="540" y="450" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="88" fill="white" letter-spacing="-2">AI That Works</text>
  <text x="540" y="550" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="700" font-size="88" fill="white" letter-spacing="-2">For You</text>
  <!-- Logo -->
  <text x="540" y="920" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="36" fill="white" opacity="0.9">Blue Canvas</text>
  <text x="1040" y="1050" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="400" font-size="18" fill="white" opacity="0.5">bluecanvas.ai</text>
</svg>