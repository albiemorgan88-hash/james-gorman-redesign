<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Forge — Blue Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0a0f1a;
  --paper: #f4f1eb;
  --blue: #1a5cff;
  --blue-dim: #1a5cff22;
  --blue-glow: #1a5cff15;
  --accent: #ff6b35;
  --accent-dim: #ff6b3520;
  --slate: #5a6178;
  --border: #d4d0c8;
  --card: #fffef9;
  --success: #2ecc71;
  --radius: 12px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  overflow-x: hidden;
}

/* Texture overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 1000;
}

.app {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

/* Header */
.header {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 48px;
  padding-bottom: 32px;
  border-bottom: 2px solid var(--ink);
}

.header h1 {
  font-family: 'Instrument Serif', serif;
  font-size: 3.2rem;
  font-weight: 400;
  line-height: 1;
  letter-spacing: -0.02em;
}

.header h1 span {
  color: var(--blue);
  font-style: italic;
}

.header-tag {
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--slate);
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 100px;
}

/* Layout */
.forge-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 32px;
  align-items: start;
}

/* Sidebar */
.sidebar {
  display: flex;
  flex-direction: column;
  gap: 20px;
  position: sticky;
  top: 24px;
}

.panel {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  animation: slideUp 0.6s ease both;
}

.panel:nth-child(2) { animation-delay: 0.1s; }
.panel:nth-child(3) { animation-delay: 0.2s; }

.panel-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  color: var(--slate);
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.field {
  margin-bottom: 14px;
}

.field:last-child { margin-bottom: 0; }

.field label {
  display: block;
  font-size: 0.78rem;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--ink);
}

.field input,
.field select,
.field textarea {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.88rem;
  background: var(--paper);
  color: var(--ink);
  transition: border-color 0.2s, box-shadow 0.2s;
}

.field input:focus,
.field select:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-dim);
}

.field textarea {
  resize: vertical;
  min-height: 80px;
}

.template-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.chip {
  padding: 7px 14px;
  border: 1px solid var(--border);
  border-radius: 100px;
  font-size: 0.78rem;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--card);
  font-family: inherit;
  color: var(--ink);
}

.chip:hover {
  border-color: var(--blue);
  background: var(--blue-glow);
}

.chip.active {
  background: var(--blue);
  color: white;
  border-color: var(--blue);
}

.btn-generate {
  width: 100%;
  padding: 14px;
  background: var(--ink);
  color: var(--paper);
  border: none;
  border-radius: 8px;
  font-family: inherit;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  letter-spacing: 0.02em;
  position: relative;
  overflow: hidden;
}

.btn-generate:hover {
  background: var(--blue);
  transform: translateY(-1px);
  box-shadow: 0 8px 24px var(--blue-dim);
}

.btn-generate:active { transform: translateY(0); }

/* Output area */
.output-area {
  animation: slideUp 0.6s ease 0.15s both;
}

.output-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}

.output-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px;
  border-bottom: 1px solid var(--border);
  background: var(--paper);
}

.output-toolbar .tab-group {
  display: flex;
  gap: 4px;
}

.tab-btn {
  padding: 6px 16px;
  border: 1px solid transparent;
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
  background: transparent;
  color: var(--slate);
  transition: all 0.2s;
}

.tab-btn.active {
  background: var(--card);
  border-color: var(--border);
  color: var(--ink);
}

.output-actions {
  display: flex;
  gap: 8px;
}

.action-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 500;
  cursor: pointer;
  background: var(--card);
  color: var(--ink);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 5px;
}

.action-btn:hover {
  border-color: var(--blue);
  color: var(--blue);
}

.action-btn.copied {
  border-color: var(--success);
  color: var(--success);
}

.output-body {
  flex: 1;
  padding: 32px;
}

.email-preview {
  max-width: 640px;
}

.email-subject {
  font-family: 'Instrument Serif', serif;
  font-size: 1.6rem;
  margin-bottom: 8px;
  line-height: 1.3;
}

.email-meta {
  font-size: 0.78rem;
  color: var(--slate);
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}

.email-body {
  font-size: 0.95rem;
  line-height: 1.75;
  white-space: pre-wrap;
  color: #2a2f3a;
}

.email-body .highlight {
  background: var(--accent-dim);
  padding: 1px 4px;
  border-radius: 3px;
  color: var(--accent);
  font-weight: 500;
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 400px;
  text-align: center;
}

.empty-icon {
  width: 80px;
  height: 80px;
  border: 2px dashed var(--border);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  margin-bottom: 20px;
  color: var(--slate);
}

.empty-state h3 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.4rem;
  font-weight: 400;
  margin-bottom: 8px;
}

.empty-state p {
  font-size: 0.85rem;
  color: var(--slate);
  max-width: 280px;
}

/* Saved templates drawer */
.saved-section {
  margin-top: 32px;
  animation: slideUp 0.6s ease 0.3s both;
}

.saved-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}

.saved-header h2 {
  font-family: 'Instrument Serif', serif;
  font-size: 1.5rem;
  font-weight: 400;
}

.saved-count {
  font-size: 0.75rem;
  color: var(--slate);
  background: var(--blue-glow);
  border: 1px solid var(--blue-dim);
  padding: 4px 12px;
  border-radius: 100px;
}

.saved-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.saved-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.25s;
  position: relative;
}

.saved-card:hover {
  border-color: var(--blue);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}

.saved-card-type {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--blue);
  margin-bottom: 8px;
}

.saved-card-subject {
  font-family: 'Instrument Serif', serif;
  font-size: 1.1rem;
  margin-bottom: 6px;
}

.saved-card-preview {
  font-size: 0.8rem;
  color: var(--slate);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.saved-card-delete {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 24px;
  height: 24px;
  border: none;
  background: transparent;
  color: var(--slate);
  cursor: pointer;
  border-radius: 4px;
  font-size: 0.85rem;
  opacity: 0;
  transition: opacity 0.2s;
}

.saved-card:hover .saved-card-delete { opacity: 1; }
.saved-card-delete:hover { color: var(--accent); }

/* Variable highlighting in raw view */
.raw-view {
  font-family: 'DM Mono', 'SF Mono', monospace;
  font-size: 0.82rem;
  line-height: 1.8;
  white-space: pre-wrap;
  color: var(--ink);
}

/* Animations */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.fade-in { animation: fadeIn 0.4s ease both; }

/* Responsive */
@media (max-width: 800px) {
  .forge-grid {
    grid-template-columns: 1fr;
  }
  .sidebar { position: static; }
  .header h1 { font-size: 2.2rem; }
}

/* Toast */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--ink);
  color: var(--paper);
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 500;
  z-index: 999;
  animation: slideUp 0.3s ease;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <h1>Outreach <span>Forge</span></h1>
    <span class="header-tag">Blue Canvas</span>
  </header>

  <div class="forge-grid">
    <aside class="sidebar">
      <div class="panel">
        <div class="panel-label">Template Type</div>
        <div class="template-chips" id="typeChips">
          <button class="chip active" data-type="cold">Cold Intro</button>
          <button class="chip" data-type="followup">Follow-up</button>
          <button class="chip" data-type="referral">Referral</button>
          <button class="chip" data-type="re-engage">Re-engage</button>
          <button class="chip" data-type="event">Post-Event</button>
          <button class="chip" data-type="value">Value Add</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label">Prospect Details</div>
        <div class="field">
          <label>Contact Name</label>
          <input type="text" id="contactName" placeholder="e.g. Sarah Mitchell">
        </div>
        <div class="field">
          <label>Company</label>
          <input type="text" id="company" placeholder="e.g. Dickson McNulty Solicitors">
        </div>
        <div class="field">
          <label>Industry / Sector</label>
          <select id="industry">
            <option value="">Select sector...</option>
            <option value="legal">Legal</option>
            <option value="construction">Construction / Trades</option>
            <option value="healthcare">Healthcare</option>
            <option value="retail">Retail / E-commerce</option>
            <option value="finance">Finance / Accounting</option>
            <option value="property">Property / Estate Agents</option>
            <option value="hospitality">Hospitality</option>
            <option value="manufacturing">Manufacturing</option>
            <option value="education">Education</option>
            <option value="charity">Charity / Non-profit</option>
            <option value="tech">Technology</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="field">
          <label>Pain Point / Hook</label>
          <textarea id="hook" placeholder="What specific problem can you solve for them? e.g. 'Still using manual quoting process'"></textarea>
        </div>
      </div>

      <div class="panel">
        <div class="panel-label">Tone & Style</div>
        <div class="template-chips" id="toneChips">
          <button class="chip active" data-tone="casual">Casual</button>
          <button class="chip" data-tone="professional">Professional</button>
          <button class="chip" data-tone="bold">Bold</button>
          <button class="chip" data-tone="warm">Warm</button>
        </div>
      </div>

      <button class="btn-generate" id="generateBtn">Generate Email →</button>
    </aside>

    <main class="output-area">
      <div class="output-card">
        <div class="output-toolbar">
          <div class="tab-group">
            <button class="tab-btn active" data-tab="preview">Preview</button>
            <button class="tab-btn" data-tab="raw">Plain Text</button>
          </div>
          <div class="output-actions">
            <button class="action-btn" id="copyBtn">📋 Copy</button>
            <button class="action-btn" id="saveBtn">💾 Save</button>
          </div>
        </div>
        <div class="output-body" id="outputBody">
          <div class="empty-state">
            <div class="empty-icon">✉</div>
            <h3>Ready to forge</h3>
            <p>Fill in the prospect details and hit generate to craft your outreach email.</p>
          </div>
        </div>
      </div>

      <div class="saved-section" id="savedSection" style="display:none">
        <div class="saved-header">
          <h2>Saved Templates</h2>
          <span class="saved-count" id="savedCount">0 saved</span>
        </div>
        <div class="saved-grid" id="savedGrid"></div>
      </div>
    </main>
  </div>
</div>

const INDUSTRY_LABELS = {
  legal: 'legal', construction: 'construction', healthcare: 'healthcare',
  retail: 'retail', finance: 'finance', property: 'property',
  hospitality: 'hospitality', manufacturing: 'manufacturing',
  education: 'education', charity: 'charity / non-profit', tech: 'tech', other: ''
};

const VALUE_PROPS = {
  legal: "For example, we recently helped a firm automate document review and client intake — saving them roughly 12 hours a week. The same kind of thing could work for {company}.",
  construction: "We've been working with construction businesses on automated quoting, project tracking, and supplier comms — the kind of stuff that eats your day but doesn't need to.",
  healthcare: "We've helped healthcare providers automate patient comms, appointment flows, and reporting — freeing clinical staff to focus on care, not admin.",
  retail: "We've helped retailers automate inventory forecasting, customer segmentation, and personalised marketing — turning data into revenue without hiring a data team.",
  finance: "We've worked with finance firms on automated reporting, compliance checks, and client onboarding — cutting hours of manual work down to minutes.",
  property: "We've helped estate agents automate lead qualification, property matching, and follow-up sequences — so nothing falls through the cracks.",
  hospitality: "We've helped hospitality businesses automate booking management, guest comms, and review responses — improving the guest experience while reducing staff workload.",
  manufacturing: "We've worked with manufacturers on predictive maintenance, quality control automation, and supply chain optimisation — real operational gains.",
  education: "We've helped education providers automate student comms, course recommendations, and administrative workflows — so educators can focus on teaching.",
  charity: "We've helped non-profits automate donor comms, grant tracking, and impact reporting — getting more done with limited resources.",
  tech: "We've helped tech companies optimise their internal workflows, automate QA processes, and build smarter customer support — because even tech firms leave AI on the table.",
  other: "We've helped businesses across sectors implement AI that saves real time and money — from automating admin to building smarter customer journeys."
};

// State
let state = {
  type: 'cold',
  tone: 'casual',
  currentEmail: null
};

let saved = JSON.parse(localStorage.getItem('outreach_saved') || '[]');

// DOM
const $ = id => document.getElementById(id);

// Chip selection
document.querySelectorAll('#typeChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#typeChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.type = chip.dataset.type;
  });
});

document.querySelectorAll('#toneChips .chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('#toneChips .chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    state.tone = chip.dataset.tone;
  });
});

// Tab switching
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderOutput();
  });
});

// Generate
$('generateBtn').addEventListener('click', generate);

function generate() {
  const name = $('contactName').value.trim() || '[Name]';
  const company = $('company').value.trim() || '[Company]';
  const industry = $('industry').value || 'other';
  const hook = $('hook').value.trim() || 'you might benefit from AI automation';
  const firstName = name.split(' ')[0];

  const template = TEMPLATES[state.type]?.[state.tone];
  if (!template) return;

  const subject = template.subjects[Math.floor(Math.random() * template.subjects.length)];
  const industryLabel = INDUSTRY_LABELS[industry] || industry;

  const hookContext = hook.toLowerCase().startsWith('i ') || hook.toLowerCase().startsWith('we ') || hook.toLowerCase().startsWith('they ')
    ? hook : hook.charAt(0).toLowerCase() + hook.slice(1);

  const valueProp = (VALUE_PROPS[industry] || VALUE_PROPS.other).replace(/{company}/g, company);

  const replacements = {
    '{name}': firstName,
    '{company}': company,
    '{industry_label}': industryLabel,
    '{hook_context}': hookContext,
    '{value_prop}': valueProp,
    '{referrer}': '[Referrer Name]',
    '{referrer_context}': 'A mutual contact mentioned you',
    '{event}': '[Event Name]'
  };

  let bodyText = template.body;
  let subjectText = subject;
  for (const [key, val] of Object.entries(replacements)) {
    bodyText = bodyText.replaceAll(key, val);
    subjectText = subjectText.replaceAll(key, val);
  }

  state.currentEmail = { subject: subjectText, body: bodyText, type: state.type, tone: state.tone };
  renderOutput();
}

function renderOutput() {
  if (!state.currentEmail) return;
  const { subject, body } = state.currentEmail;
  const activeTab = document.querySelector('.tab-btn.active').dataset.tab;

  if (activeTab === 'preview') {
    $('outputBody').innerHTML = `
      <div class="email-preview fade-in">
        <div class="email-subject">${escHtml(subject)}</div>
        <div class="email-meta">To: ${escHtml($('contactName').value || '[Name]')} · ${escHtml(state.type)} · ${escHtml(state.tone)}</div>
        <div class="email-body">${formatBody(body)}</div>
      </div>`;
  } else {
    $('outputBody').innerHTML = `
      <div class="fade-in">
        <div class="raw-view">Subject: ${escHtml(subject)}\n\n${escHtml(body)}</div>
      </div>`;
  }
}

function formatBody(text) {
  // Highlight placeholders
  return escHtml(text).replace(/\[([^\]]+)\]/g, '<span class="highlight">[$1]</span>');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Copy
$('copyBtn').addEventListener('click', () => {
  if (!state.currentEmail) return;
  const text = `Subject: ${state.currentEmail.subject}\n\n${state.currentEmail.body}`;
  navigator.clipboard.writeText(text).then(() => {
    $('copyBtn').classList.add('copied');
    $('copyBtn').textContent = '✓ Copied';
    setTimeout(() => {
      $('copyBtn').classList.remove('copied');
      $('copyBtn').textContent = '📋 Copy';
    }, 2000);
  });
});

// Save
$('saveBtn').addEventListener('click', () => {
  if (!state.currentEmail) return;
  saved.unshift({
    ...state.currentEmail,
    id: Date.now(),
    contact: $('contactName').value,
    company: $('company').value,
    date: new Date().toLocaleDateString()
  });
  localStorage.setItem('outreach_saved', JSON.stringify(saved));
  renderSaved();
  toast('Template saved');
});

function renderSaved() {
  if (saved.length === 0) {
    $('savedSection').style.display = 'none';
    return;
  }
  $('savedSection').style.display = 'block';
  $('savedCount').textContent = `${saved.length} saved`;
  $('savedGrid').innerHTML = saved.map(s => `
    <div class="saved-card" onclick="loadSaved(${s.id})">
      <button class="saved-card-delete" onclick="event.stopPropagation();deleteSaved(${s.id})">✕</button>
      <div class="saved-card-type">${s.type} · ${s.tone}</div>
      <div class="saved-card-subject">${escHtml(s.subject)}</div>
      <div class="saved-card-preview">${escHtml(s.body.substring(0, 100))}...</div>
    </div>`).join('');
}

window.loadSaved = function(id) {
  const item = saved.find(s => s.id === id);
  if (!item) return;
  state.currentEmail = item;
  renderOutput();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

window.deleteSaved = function(id) {
  saved = saved.filter(s => s.id !== id);
  localStorage.setItem('outreach_saved', JSON.stringify(saved));
  renderSaved();
  toast('Template deleted');
};

function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// Init
renderSaved();
</script>
</body>
