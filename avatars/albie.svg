<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#accent)" stroke-width="3" opacity="0.5"/>
  <!-- Wrench icon - stylized -->
  <g transform="translate(256,240)" fill="none" stroke="url(#glow)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round">
    <!-- Wrench head -->
    <path d="M-60,-60 L-40,-40 M-40,-40 L-55,-25 A30,30 0 0,0 -25,-55 L-40,-40" opacity="0.9"/>
    <!-- Wrench shaft -->
    <line x1="-40" y1="-40" x2="45" y2="45" stroke-width="14"/>
    <!-- Wrench end -->
    <rect x="35" y="35" width="40" height="20" rx="4" transform="rotate(45,55,45)" fill="url(#glow)" stroke="none"/>
  </g>
  <!-- Letter A -->
  <text x="256" y="280" font-family="SF Pro Display, -apple-system, Helvetica Neue, Arial, sans-serif" font-size="160" font-weight="700" fill="white" text-anchor="middle" dominant-baseline="central" opacity="0.95">A</text>
  <!-- Subtle dot indicator - "online" -->
  <circle cx="380" cy="380" r="18" fill="#00d26a"/>
  <circle cx="380" cy="380" r="18" fill="none" stroke="#1a1a2e" stroke-width="6"/>
</svg>