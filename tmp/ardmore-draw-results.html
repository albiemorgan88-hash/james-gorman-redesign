<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ardmore Draw Results</title>
<style>
  :root {
    --bg: #f4f7f2;
    --card: #ffffff;
    --navy: #14233a;
    --green: #3d6546;
    --gold: #c7a34c;
    --muted: #66707c;
    --line: #dde4db;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
  }
  .frame {
    width: 1080px;
    min-height: 1350px;
    margin: 0 auto;
    padding: 70px;
    background: var(--bg);
  }
  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 36px;
    padding: 72px 56px 64px;
    box-shadow: 0 6px 24px rgba(20,35,58,0.05);
  }
  h1 {
    margin: 0;
    font-size: 68px;
    line-height: 1;
    text-align: center;
    color: var(--navy);
    letter-spacing: -1.8px;
  }
  .sub {
    margin-top: 18px;
    text-align: center;
    color: var(--green);
    font-size: 34px;
    font-weight: 600;
  }
  .date {
    margin-top: 18px;
    text-align: center;
    color: var(--muted);
    font-size: 28px;
  }
  .bar {
    width: calc(100% - 160px);
    height: 8px;
    border-radius: 999px;
    background: var(--gold);
    margin: 42px auto 48px;
  }
  .row {
    display: grid;
    grid-template-columns: 86px 1fr auto;
    align-items: center;
    gap: 24px;
    padding: 30px 34px;
    margin-bottom: 28px;
    border: 2px solid var(--line);
    border-radius: 28px;
    background: #fafcf9;
  }
  .row:nth-child(even) { background: #f7f9fb; }
  .medal {
    font-size: 58px;
    text-align: center;
  }
  .name {
    color: var(--navy);
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.6px;
    margin-bottom: 10px;
  }
  .meta {
    color: var(--green);
    font-size: 34px;
    font-weight: 600;
  }
  .amount {
    color: var(--navy);
    font-size: 44px;
    font-weight: 800;
    letter-spacing: -0.6px;
    white-space: nowrap;
  }
  .footer {
    margin-top: 40px;
    text-align: center;
    color: var(--muted);
    font-size: 28px;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="card">
      <h1>Ardmore Cricket Club</h1>
      <div class="sub">Weekly Draw Results</div>
      <div class="date">Friday 17 April 2026</div>
      <div class="bar"></div>

      <div class="row">
        <div class="medal">🥇</div>
        <div>
          <div class="name">Vicky Burns</div>
          <div class="meta">1st Prize • No. 67</div>
        </div>
        <div class="amount">£65.00</div>
      </div>

      <div class="row">
        <div class="medal">🥈</div>
        <div>
          <div class="name">Vicky Burns</div>
          <div class="meta">2nd Prize • No. 469</div>
        </div>
        <div class="amount">£39.00</div>
      </div>

      <div class="row">
        <div class="medal">🥉</div>
        <div>
          <div class="name">Vicky Burns</div>
          <div class="meta">3rd Prize • No. 373</div>
        </div>
        <div class="amount">£26.00</div>
      </div>

      <div class="footer">Congratulations from everyone at Ardmore CC</div>
    </div>
  </div>
</body>
</html>
